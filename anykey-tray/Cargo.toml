[package]
name = "anykey-tray"
version = "0.1.0"
edition = "2021"
description = "AnyKey system tray — engine lifecycle, IPC server, autostart (Rust port of tray/main.py)"

[dependencies]
serde_json = "1"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
strip = true
