<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7aa2f7"/>
    </marker>
    <linearGradient id="gGUI" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4252"/><stop offset="1" stop-color="#4c566a"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="环境" x="0" width="720" height="420" fill="#1e1e2e" rx="14"/>
  <text x="24" y="36" fill="#cdd6f4" font-size="18" font-weight="700">AnyKey 模组架构图谱</text>
  <text x="24" y="58" fill="#9399b2" font-size="12">四大运行模组 + 共享 Lib 层（单向依赖）</text>

  <!-- Engine + Driver column (Rust / kernel) -->
  <rect x="430" y="90" width="250" height="290" fill="#282a36" rx="10" stroke="#45475a"/>
  <text x="448" y="116" fill="#a6e3a1" font-size="13" font-weight="700">后端核心 (Rust + WDK)</text>

  <rect x="450" y="130" width="210" height="58" fill="url(#gGUI)" rx="8"/>
  <text x="462" y="150" fill="#cdd6f4" font-size="12" font-weight="600">anykey-engine/</text>
  <text x="462" y="172" fill="#9399b2" font-size="10">lib.rs · main.rs · state.rs · pipeline.rs</text>

  <rect x="450" y="198" width="210" height="58" fill="url(#gGUI)" rx="8"/>
  <text x="462" y="218" fill="#cdd6f4" font-size="12" font-weight="600">anykey-filter-driver/</text>
  <text x="462" y="240" fill="#9399b2" font-size="10">public.h · anykey_flt.c · rawpdo.c</text>

  <rect x="450" y="266" width="210" height="40" fill="#1e1e2e" stroke="#45475a" rx="8"/>
  <text x="462" y="291" fill="#f38ba8" font-size="11">内核 Input Queue (键盘/鼠标)</text>

  <!-- Python side column -->
  <rect x="40" y="90" width="250" height="290" fill="#282a36" rx="10" stroke="#45475a"/>
  <text x="58" y="116" fill="#89dceb" font-size="13" font-weight="700">前端 + 控制 (Python)</text>

  <rect x="60" y="130" width="210" height="58" fill="url(#gGUI)" rx="8"/>
  <text x="72" y="150" fill="#cdd6f4" font-size="12" font-weight="600">gui/</text>
  <text x="72" y="172" fill="#9399b2" font-size="10">main.py · components.py · layout.py</text>

  <rect x="60" y="198" width="210" height="58" fill="url(#gGUI)" rx="8"/>
  <text x="72" y="218" fill="#cdd6f4" font-size="12" font-weight="600">tray/</text>
  <text x="72" y="240" fill="#9399b2" font-size="10">main.py · __init__.py (生命周期)</text>

  <rect x="60" y="266" width="210" height="58" fill="url(#gGUI)" rx="8"/>
  <text x="72" y="286" fill="#cdd6f4" font-size="12" font-weight="600">lib/ (共享层)</text>
  <text x="72" y="308" fill="#9399b2" font-size="10">config.py · ipc.py · driver.py</text>

  <!-- connections -->
  <line x1="270" y1="160" x2="430" y2="160" stroke="#7aa2f7" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
  <line x1="270" y1="226" x2="430" y2="226" stroke="#7aa2f7" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
  <line x1="270" y1="294" x2="430" y2="294" stroke="#7aa2f7" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
  <line x1="355" y1="318" x2="355" y2="350" stroke="#f9e2af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="505" y1="306" x2="505" y2="350" stroke="#a6e3a1" stroke-width="1.5"/>

  <!-- IPC pipe note -->
  <rect x="300" y="340" width="120" height="44" fill="#1e1e2e" stroke="#585b70" rx="8"/>
  <text x="318" y="362" fill="#f9e2af" font-size="11" font-weight="600">Named Pipe</text>
  <text x="312" y="378" fill="#9399b2" font-size="9">GUI ⇄ Tray (TCP:19527)</text>

  <text x="24" y="404" fill="#6c7086" font-size="10">依赖方向：GUI → Lib ← Tray ｜ Tray → IPC ⇄ Engine → FilterDriver → 内核</text>
</svg>
