name: Feature Request
description: 提出新功能 / 改进建议
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述使用场景与痛点
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望怎么实现（行为 / 配置格式 / UI）
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你试过其他工具/配置能达到类似效果吗
